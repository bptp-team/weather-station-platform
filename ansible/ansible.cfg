[defaults]
inventory = inventory/azure.yaml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
nocows = 1

[ssh_connection]
# The VM is on a public address: pin its host key on first contact, refuse changes after.
ssh_args = -o StrictHostKeyChecking=accept-new
pipelining = True
