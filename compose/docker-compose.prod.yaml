services:
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  influxdb3:
    image: influxdb:3-core
    container_name: influxdb3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3
    command:
      - influxdb3
      - serve
      - --node-id
      - influxdb3
      - --object-store
      - file
      - --data-dir
      - /var/lib/influxdb3
      - --without-auth

  backend:
    image: ${ACR_LOGIN_SERVER}/weather-station-backend:${BACKEND_VERSION:?}
    container_name: backend
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb3
    environment:
      WEATHER_MQTT_HOST: mosquitto
      WEATHER_INFLUX_URL: http://influxdb3:8181
      # The edge reaches the backend from the Docker bridge, not from 127.0.0.1.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: ${ACR_LOGIN_SERVER}/weather-station-frontend:${FRONTEND_VERSION:?}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  edge:
    image: nginx:1.30.4
    container_name: edge
    restart: unless-stopped
    # Host networking reaches the loopback ports above and serves 80 and 443 directly.
    network_mode: host
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - edge-acme:/var/cache/nginx

volumes:
  influxdb3-data:
  edge-acme:
